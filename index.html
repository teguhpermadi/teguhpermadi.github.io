<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teguh Permadi - Homepage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        'bg-1': '#0f172a',
                        'bg-2': '#1e1b4b',
                        'bg-3': '#312e81',
                        accent: '#38bdf8',
                    },
                    animation: {
                        'gradient-xy': 'gradientBG 15s ease infinite',
                        'blob': 'float 10s infinite ease-in-out alternate',
                    },
                    keyframes: {
                        gradientBG: {
                            '0%, 100%': { 'background-position': '0% 50%' },
                            '50%': { 'background-position': '100% 50%' },
                        },
                        float: {
                            '0%': { transform: 'translateY(0) scale(1)' },
                            '100%': { transform: 'translateY(30px) scale(1.1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .text-gradient {
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bg-size-400 {
            background-size: 400% 400%;
        }

        .btn-hover-fx::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #38bdf8;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
            z-index: -1;
            border-radius: 9999px;
        }

        .btn-hover-fx:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }
    </style>
</head>

<body
    class="font-outfit min-h-screen flex justify-center items-center bg-gradient-to-tr from-bg-1 via-bg-2 to-bg-3 bg-size-400 animate-gradient-xy text-slate-50 overflow-hidden relative">
    <div
        class="absolute blur-[80px] opacity-60 animate-blob w-[300px] h-[300px] bg-purple-500 top-[-100px] left-[-100px] rounded-full z-0">
    </div>
    <div
        class="absolute blur-[80px] opacity-60 animate-blob w-[400px] h-[400px] bg-cyan-500 bottom-[-150px] right-[-100px] rounded-full z-0 [animation-delay:-5s]">
    </div>

    <div
        class="glass-panel relative z-10 border border-white/10 rounded-3xl py-8 sm:py-12 px-6 sm:px-8 md:px-16 text-center shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5)] hover:shadow-[0_30px_60px_-15px_rgba(0,0,0,0.6)] hover:-translate-y-1 transition-all duration-300 w-[92%] sm:w-[90%] max-w-[450px]">
        <h1 class="text-4xl sm:text-5xl font-bold mb-2 text-gradient">Teguh Permadi</h1>
        <p class="text-slate-300 text-base sm:text-lg font-light mb-6 sm:mb-10 leading-relaxed">Selamat datang di
            halaman utama saya. Silakan jelajahi proyek-proyek saya di bawah ini.</p>
        <a href="addition/index.html"
            class="inline-block bg-sky-400/10 text-accent hover:text-bg-1 font-medium text-base sm:text-lg py-3 px-6 sm:px-8 rounded-full border border-sky-400/30 transition-all duration-300 relative overflow-hidden btn-hover-fx hover:border-accent hover:shadow-[0_0_20px_rgba(56,189,248,0.4)] z-0">
            Penjumlahan
        </a>
        <a href="sorting/index.html"
            class="inline-block bg-sky-400/10 text-accent hover:text-bg-1 font-medium text-base sm:text-lg py-3 px-6 sm:px-8 rounded-full border border-sky-400/30 transition-all duration-300 relative overflow-hidden btn-hover-fx hover:border-accent hover:shadow-[0_0_20px_rgba(56,189,248,0.4)] z-0 mt-4">
            Mengurutkan
        </a>
        <a href="composition-decomposition/index.html"
            class="inline-block bg-sky-400/10 text-accent hover:text-bg-1 font-medium text-base sm:text-lg py-3 px-6 sm:px-8 rounded-full border border-sky-400/30 transition-all duration-300 relative overflow-hidden btn-hover-fx hover:border-accent hover:shadow-[0_0_20px_rgba(56,189,248,0.4)] z-0 mt-4">
            Komposisi & Dekomposisi
        </a>
        <a href="multiplication/index.html"
            class="inline-block bg-sky-400/10 text-accent hover:text-bg-1 font-medium text-base sm:text-lg py-3 px-6 sm:px-8 rounded-full border border-sky-400/30 transition-all duration-300 relative overflow-hidden btn-hover-fx hover:border-accent hover:shadow-[0_0_20px_rgba(56,189,248,0.4)] z-0 mt-4">
            Perkalian
        </a>
    </div>
</body>

</html>
