<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teguh Permadi - Homepage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        'bg-1': '#0f172a',
                        'bg-2': '#1e1b4b',
                        'bg-3': '#312e81',
                        accent: '#38bdf8',
                    },
                    animation: {
                        'gradient-xy': 'gradientBG 15s ease infinite',
                        'blob': 'float 10s infinite ease-in-out alternate',
                    },
                    keyframes: {
                        gradientBG: {
                            '0%, 100%': { 'background-position': '0% 50%' },
                            '50%': { 'background-position': '100% 50%' },
                        },
                        float: {
                            '0%': { transform: 'translateY(0) scale(1)' },
                            '100%': { transform: 'translateY(30px) scale(1.1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .text-gradient {
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bg-size-400 {
            background-size: 400% 400%;
        }

        .btn-hover-fx::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #38bdf8;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
            z-index: -1;
            border-radius: 9999px;
        }

        .btn-hover-fx:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .lb-tab.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.5);
            color: #38bdf8;
        }
    </style>
</head>

<body
    class="font-outfit min-h-screen flex flex-col justify-center items-center bg-gradient-to-tr from-bg-1 via-bg-2 to-bg-3 bg-size-400 animate-gradient-xy text-slate-50 relative">

    <div
        class="absolute blur-[80px] opacity-60 animate-blob w-[300px] h-[300px] bg-purple-500 top-[-100px] left-[-100px] rounded-full z-0">
    </div>
    <div
        class="absolute blur-[80px] opacity-60 animate-blob w-[400px] h-[400px] bg-cyan-500 bottom-[-150px] right-[-100px] rounded-full z-0 [animation-delay:-5s]">
    </div>

    <!-- Auth Bar -->
    <div class="fixed top-0 left-0 right-0 z-50 px-4 py-3">
        <div class="max-w-[450px] mx-auto flex justify-end">
            <div id="authContainer"></div>
        </div>
    </div>

    <!-- Content Wrapper: side-by-side on desktop, stacked on mobile -->
    <div
        class="flex flex-col lg:flex-row items-center lg:items-start justify-center gap-6 w-full max-w-[950px] mx-auto pt-14 pb-10 px-4">

        <!-- Main Card -->
        <div
            class="glass-panel relative z-10 border border-white/10 rounded-3xl py-8 sm:py-12 px-6 sm:px-8 md:px-16 text-center shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5)] hover:shadow-[0_30px_60px_-15px_rgba(0,0,0,0.6)] hover:-translate-y-1 transition-all duration-300 w-full max-w-[450px]">
            <h1 class="text-4xl sm:text-5xl font-bold mb-2 text-gradient">Teguh Permadi</h1>
            <p class="text-slate-300 text-base sm:text-lg font-light mb-6 sm:mb-10 leading-relaxed">Selamat datang di
                halaman utama saya. Silakan jelajahi proyek-proyek saya di bawah ini.</p>
            <a href="addition/index.html"
                class="inline-block bg-sky-400/10 text-accent hover:text-bg-1 font-medium text-base sm:text-lg py-3 px-6 sm:px-8 rounded-full border border-sky-400/30 transition-all duration-300 relative overflow-hidden btn-hover-fx hover:border-accent hover:shadow-[0_0_20px_rgba(56,189,248,0.4)] z-0">
                Penjumlahan
            </a>
            <a href="subtraction/index.html"
                class="inline-block bg-sky-400/10 text-accent hover:text-bg-1 font-medium text-base sm:text-lg py-3 px-6 sm:px-8 rounded-full border border-sky-400/30 transition-all duration-300 relative overflow-hidden btn-hover-fx hover:border-accent hover:shadow-[0_0_20px_rgba(56,189,248,0.4)] z-0">
                Pengurangan
            </a>
            <a href="sorting/index.html"
                class="inline-block bg-sky-400/10 text-accent hover:text-bg-1 font-medium text-base sm:text-lg py-3 px-6 sm:px-8 rounded-full border border-sky-400/30 transition-all duration-300 relative overflow-hidden btn-hover-fx hover:border-accent hover:shadow-[0_0_20px_rgba(56,189,248,0.4)] z-0 mt-4">
                Mengurutkan
            </a>
            <a href="composition-decomposition/index.html"
                class="inline-block bg-sky-400/10 text-accent hover:text-bg-1 font-medium text-base sm:text-lg py-3 px-6 sm:px-8 rounded-full border border-sky-400/30 transition-all duration-300 relative overflow-hidden btn-hover-fx hover:border-accent hover:shadow-[0_0_20px_rgba(56,189,248,0.4)] z-0 mt-4">
                Komposisi & Dekomposisi
            </a>
            <a href="multiplication/index.html"
                class="inline-block bg-sky-400/10 text-accent hover:text-bg-1 font-medium text-base sm:text-lg py-3 px-6 sm:px-8 rounded-full border border-sky-400/30 transition-all duration-300 relative overflow-hidden btn-hover-fx hover:border-accent hover:shadow-[0_0_20px_rgba(56,189,248,0.4)] z-0 mt-4">
                Perkalian
            </a>
            <a href="division/index.html"
                class="inline-block bg-sky-400/10 text-accent hover:text-bg-1 font-medium text-base sm:text-lg py-3 px-6 sm:px-8 rounded-full border border-sky-400/30 transition-all duration-300 relative overflow-hidden btn-hover-fx hover:border-accent hover:shadow-[0_0_20px_rgba(56,189,248,0.4)] z-0 mt-4">
                Pembagian
            </a>
        </div>

        <!-- Leaderboard Section -->
        <div class="relative z-10 w-full lg:w-[400px] shrink-0">
            <div
                class="glass-panel border border-white/10 rounded-3xl p-5 sm:p-7 shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5)]">
                <div class="flex items-center gap-3 mb-5">
                    <div class="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center">
                        <i class="fas fa-trophy text-amber-400"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-white">Leaderboard</h2>
                        <p class="text-xs text-slate-400">Papan skor terbaik semua permainan</p>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="flex gap-1.5 overflow-x-auto no-scrollbar mb-4 pb-1">
                    <button onclick="switchTab('addition')" data-tab="addition"
                        class="lb-tab active shrink-0 px-3 py-1.5 rounded-lg border border-white/10 text-xs font-semibold text-slate-400 transition-all">Penjumlahan</button>
                    <button onclick="switchTab('sorting')" data-tab="sorting"
                        class="lb-tab shrink-0 px-3 py-1.5 rounded-lg border border-white/10 text-xs font-semibold text-slate-400 transition-all">Mengurutkan</button>
                    <button onclick="switchTab('composition')" data-tab="composition"
                        class="lb-tab shrink-0 px-3 py-1.5 rounded-lg border border-white/10 text-xs font-semibold text-slate-400 transition-all">Komposisi</button>
                    <button onclick="switchTab('multiplication')" data-tab="multiplication"
                        class="lb-tab shrink-0 px-3 py-1.5 rounded-lg border border-white/10 text-xs font-semibold text-slate-400 transition-all">Perkalian</button>
                    <button onclick="switchTab('division')" data-tab="division"
                        class="lb-tab shrink-0 px-3 py-1.5 rounded-lg border border-white/10 text-xs font-semibold text-slate-400 transition-all">Pembagian</button>
                </div>

                <!-- Leaderboard Content -->
                <div id="leaderboardContent" class="min-h-[120px] max-h-[420px] overflow-y-auto no-scrollbar">
                    <div class="text-center py-8 text-slate-500 text-sm">
                        <i class="fas fa-spinner fa-spin text-lg mb-2 block"></i>
                        Memuat skor...
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="firebase-config.js"></script>
    <script>
        // Auth UI
        renderAuthUI('authContainer');

        // Leaderboard
        let currentTab = 'addition';
        let leaderboardCache = {};

        const gameLabels = {
            addition: 'Penjumlahan',
            sorting: 'Mengurutkan',
            composition: 'Komposisi',
            multiplication: 'Perkalian',
            division: 'Pembagian'
        };

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.lb-tab').forEach(b => {
                b.classList.toggle('active', b.dataset.tab === tab);
            });
            loadLeaderboard(tab);
        }

        async function loadLeaderboard(gameType) {
            const container = document.getElementById('leaderboardContent');

            if (leaderboardCache[gameType]) {
                renderLeaderboardTable(leaderboardCache[gameType], container, {
                    showUserPhoto: true,
                    highlightUserId: window.currentUser ? window.currentUser.uid : null,
                    maxEntries: 10,
                    emptyMessage: 'Belum ada skor untuk kategori ini.'
                });
                return;
            }

            container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm"><i class="fas fa-spinner fa-spin text-lg mb-2 block"></i>Memuat skor...</div>`;

            try {
                const scores = await getLeaderboardFromFirestore(gameType, 50);
                leaderboardCache[gameType] = scores;
                renderLeaderboardTable(scores, container, {
                    showUserPhoto: true,
                    highlightUserId: window.currentUser ? window.currentUser.uid : null,
                    maxEntries: 10,
                    emptyMessage: 'Belum ada skor untuk kategori ini. Mainkan gamenya!'
                });
            } catch (e) {
                container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Gagal memuat skor.</div>`;
            }
        }

        window.addEventListener('authStateChanged', () => {
            leaderboardCache = {};
            loadLeaderboard(currentTab);
        });

        window.firebaseReady.then(() => {
            loadLeaderboard('addition');
        });
    </script>
</body>

</html>
